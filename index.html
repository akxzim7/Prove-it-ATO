<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prove It — ATO Scam Simulator</title>
<style>
  :root {
    --bg: #0f172a;
    --bg-card: #1e293b;
    --bg-card-hover: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --accent: #f59e0b;
    --accent-hover: #fbbf24;
    --danger: #ef4444;
    --danger-bg: #7f1d1d;
    --success: #22c55e;
    --success-bg: #14532d;
    --info: #3b82f6;
    --border: #334155;
    --radius: 12px;
    --shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    line-height: 1.6;
  }
  .disclaimer {
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    padding: 8px 12px;
    background: rgba(0,0,0,0.3);
    border-radius: 6px;
    margin-bottom: 16px;
    max-width: 600px;
    width: 100%;
  }
  .container {
    max-width: 600px;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .card {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    animation: fadeIn 0.35s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  h1 { font-size: 1.8rem; margin-bottom: 8px; color: var(--accent); }
  h2 { font-size: 1.25rem; margin-bottom: 12px; }
  p { margin-bottom: 16px; color: var(--text-muted); }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 20px;
    margin-bottom: 10px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
  }
  .btn-primary {
    background: var(--accent);
    color: #0f172a;
    text-align: center;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-option {
    background: var(--bg-card-hover);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-option:hover { background: #475569; border-color: var(--accent); }
  .btn-back {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    text-align: center;
    margin-top: 12px;
  }
  .btn-back:hover { color: var(--text); border-color: var(--text-muted); }
  .tag {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .tag-scam { background: var(--danger-bg); color: #fecaca; }
  .tag-real { background: var(--success-bg); color: #bbf7d0; }
  .tag-simulated { background: #1e3a5f; color: #60a5fa; }
  .message-bubble {
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
    font-size: 0.95rem;
  }
  .message-bubble .sender {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .message-bubble .timestamp {
    font-size: 0.7rem;
    color: #64748b;
    margin-top: 8px;
  }
  .progress-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
  }
  .progress-dot {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    transition: background 0.3s;
  }
  .progress-dot.active { background: var(--accent); }
  .progress-dot.complete { background: var(--success); }
  .character {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .character-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #d97706);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.2rem;
    color: #0f172a;
    flex-shrink: 0;
  }
  .character-info h3 { font-size: 1rem; margin: 0; color: var(--text); }
  .character-info span { font-size: 0.85rem; color: var(--text-muted); }
  .reveal-box {
    background: rgba(59, 130, 246, 0.08);
    border-left: 3px solid var(--info);
    padding: 14px 16px;
    border-radius: 0 8px 8px 0;
    margin: 14px 0;
  }
  .reveal-box h4 { color: #60a5fa; margin-bottom: 6px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .reveal-box p { margin: 0; color: #cbd5e1; font-size: 0.9rem; }
  .pathway-step {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .pathway-num {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent);
    color: #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .pathway-text { font-size: 0.9rem; color: #cbd5e1; }
  .report-metric {
    text-align: center;
    padding: 24px;
    background: rgba(245, 158, 11, 0.08);
    border-radius: var(--radius);
    margin-bottom: 20px;
  }
  .report-metric .number { font-size: 3.2rem; font-weight: 800; color: var(--accent); }
  .report-metric .label { font-size: 0.9rem; color: var(--text-muted); }
  .summary-item {
    padding: 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .summary-item .title { font-weight: 600; font-size: 0.9rem; }
  .summary-item .choice { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
  .screenshot-frame {
    background: #0f172a;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    margin: 16px 0;
    text-align: center;
  }
  .screenshot-frame img {
    max-width: 100%;
    border-radius: 8px;
    display: block;
    margin: 0 auto;
  }
  .screenshot-caption {
    font-size: 0.7rem;
    color: #64748b;
    margin-top: 8px;
    text-align: center;
  }
  .autofill-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.98);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .autofill-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    max-width: 400px;
    width: 100%;
  }
  .fake-field { margin-bottom: 14px; }
  .fake-field-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .fake-field-value {
    height: 40px;
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-family: monospace;
    font-size: 0.9rem;
    color: var(--text);
    overflow: hidden;
  }
  .fake-field-value .typed {
    display: inline-block;
    white-space: nowrap;
    overflow: hidden;
    animation: typing 1.5s steps(20, end) forwards;
    width: 0;
  }
  @keyframes typing { to { width: 100%; } }
  .fake-field-value .cursor {
    display: inline-block;
    width: 2px;
    height: 18px;
    background: var(--accent);
    animation: blink 0.8s infinite;
    margin-left: 2px;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .autofill-warning {
    margin-top: 16px;
    padding: 12px;
    background: var(--danger-bg);
    border-radius: 8px;
    color: #fecaca;
    font-size: 0.85rem;
    text-align: center;
    opacity: 0;
    animation: fadeIn 0.5s ease 3s forwards;
  }
  .hidden { display: none !important; }

  /* ---------- Motion & feedback layer ---------- */
  @keyframes slideUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.92) translateY(10px); }
    60% { opacity: 1; transform: scale(1.02); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-7px); }
    40%, 60% { transform: translateX(7px); }
  }
  @keyframes flashSuccess { from { box-shadow: 0 0 0 0 rgba(34,197,94,0.55); } to { box-shadow: 0 0 0 20px rgba(34,197,94,0); } }
  @keyframes flashDanger { from { box-shadow: 0 0 0 0 rgba(239,68,68,0.55); } to { box-shadow: 0 0 0 20px rgba(239,68,68,0); } }
  @keyframes pulseChip { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  @keyframes dotBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.45; } 30% { transform: translateY(-5px); opacity: 1; } }
  @keyframes badgeIn {
    0% { transform: scale(0.5) rotate(-12deg); opacity: 0; }
    70% { transform: scale(1.08) rotate(3deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes fillBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes confettiFall { to { transform: translate3d(var(--dx), 110vh, 0) rotate(var(--rot)); opacity: 0; } }

  .card.card-shake { animation: fadeIn 0.35s ease, shake 0.5s ease 0.05s; }

  /* Button press feedback */
  .btn:active { transform: scale(0.985); }
  .btn-primary { box-shadow: 0 4px 14px rgba(245,158,11,0.22); }
  .btn-primary:hover { transform: translateY(-1px); }
  .btn-option { animation: slideUp 0.32s ease backwards; }
  .btn-option:hover { transform: translateX(3px); }

  /* HUD: situation counter + live score chip */
  .hud {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 12px;
  }
  .hud-label {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--text-muted); font-weight: 600;
  }
  .score-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.35);
    color: #bbf7d0; font-size: 0.72rem; font-weight: 700;
    padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  }
  .score-chip.bump { animation: pulseChip 0.45s ease; }

  .progress-dot { position: relative; overflow: hidden; }
  .progress-dot.active { background: var(--border); }
  .progress-dot.active::after {
    content: ''; position: absolute; inset: 0;
    background: var(--accent); transform-origin: left;
    animation: fillBar 0.5s ease forwards;
  }

  /* Incoming-message anticipation beat */
  .typing-bubble {
    display: inline-flex; gap: 5px; align-items: center;
    background: #0f172a; border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 18px; margin-bottom: 20px;
  }
  .typing-bubble span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-muted); animation: dotBounce 1.1s infinite;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }
  .msg-in { animation: popIn 0.38s cubic-bezier(0.2,0.8,0.3,1.2); }

  /* Verdict badge on feedback screen */
  .verdict { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .verdict-icon {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.35rem; flex-shrink: 0;
  }
  .verdict-icon.safe {
    background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.5);
    animation: badgeIn 0.45s cubic-bezier(0.2,0.8,0.3,1.4), flashSuccess 0.9s ease 0.25s;
  }
  .verdict-icon.risky {
    background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.5);
    animation: badgeIn 0.45s cubic-bezier(0.2,0.8,0.3,1.4), flashDanger 0.9s ease 0.25s;
  }

  /* Character avatar with personality */
  .character-avatar.emoji {
    background: linear-gradient(135deg, #334155, #1e293b);
    border: 1px solid var(--border);
    font-size: 1.5rem;
  }

  /* Landing hero */
  .hero-badge {
    width: 72px; height: 72px; margin: 0 auto 14px;
    border-radius: 22px;
    background: linear-gradient(135deg, rgba(245,158,11,0.25), rgba(59,130,246,0.18));
    border: 1px solid rgba(245,158,11,0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.1rem; animation: floaty 3.4s ease-in-out infinite;
  }

  /* Report payoff */
  .rank-badge {
    width: 92px; height: 92px; margin: 0 auto 10px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 2.6rem;
    background: linear-gradient(135deg, rgba(245,158,11,0.22), rgba(59,130,246,0.15));
    border: 1px solid rgba(245,158,11,0.4);
    animation: badgeIn 0.6s cubic-bezier(0.2,0.8,0.3,1.4);
  }
  .rank-label {
    text-align: center; font-weight: 700; color: var(--accent);
    letter-spacing: 0.5px; margin-bottom: 4px;
  }
  .summary-item { animation: slideUp 0.3s ease backwards; }

  /* Sound toggle (button, not an input) */
  .sound-toggle {
    position: fixed; bottom: 14px; right: 14px; z-index: 150;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(30,41,59,0.92); border: 1px solid var(--border);
    color: var(--text-muted); font-size: 1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .sound-toggle:hover { color: var(--text); border-color: var(--accent); }

  /* Confetti layer */
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 200; overflow: hidden; }
  .confetti-piece {
    position: absolute; top: -16px; width: 8px; height: 14px;
    border-radius: 2px; animation: confettiFall linear forwards;
  }

  @media (max-width: 480px) {
    h1 { font-size: 1.5rem; }
    .card { padding: 20px; }
    .hud-label { font-size: 0.65rem; }
    .score-chip { font-size: 0.65rem; padding: 3px 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>

<div class="disclaimer">
  An independent student project. Not affiliated with or endorsed by the Australian Taxation Office.
</div>

<div class="container" id="app"></div>

<div id="autofill-overlay" class="autofill-screen hidden">
  <div class="autofill-box">
    <div class="fake-field">
      <div class="fake-field-label">Full Name</div>
      <div class="fake-field-value"><span class="typed" style="animation-delay:0.3s;">Sam T.</span><span class="cursor"></span></div>
    </div>
    <div class="fake-field">
      <div class="fake-field-label">TFN</div>
      <div class="fake-field-value"><span class="typed" style="animation-delay:1.2s;">••• ••• •••</span><span class="cursor"></span></div>
    </div>
    <div class="fake-field">
      <div class="fake-field-label">Bank BSB / Account</div>
      <div class="fake-field-value"><span class="typed" style="animation-delay:2.0s;">062-000 / ••••••••</span><span class="cursor"></span></div>
    </div>
    <div class="autofill-warning">
      ⚠️ This information is being sent to an unknown server.
    </div>
  </div>
</div>

<div id="confetti" aria-hidden="true"></div>

<button id="sound-toggle" class="sound-toggle" onclick="toggleSound()" aria-label="Mute sound">🔊</button>

<script>
const scenarios = [
  {
    id: 1,
    title: "Fake Tax Refund",
    character: { name: "Sam", age: 17, initial: "S", emoji: "🧑‍🍳" },
    setup: "You lodged your first tax return three weeks ago after starting a part-time job at a café.",
    message: {
      channel: "SMS",
      sender: "+61 4•• ••• 291",
      timestamp: "Today, 4:12pm",
      body: "ATO: You are due a tax refund of $642.00 for the 2025-26 financial year. Your refund has been approved but requires verification. Click the link below to confirm your bank details within 24 hours to avoid forfeiture.\n\n[Link: ato-refund-verify.com]"
    },
    question: "How would you check if this refund is real?",
    options: [
      { text: "Tap the link and enter your details to claim the refund", id: "tap_link", unsafe: true, autofill: true },
      { text: "Call the number in the message to confirm", id: "call_number", unsafe: true, autofill: false },
      { text: "Search Google and click the first result", id: "google", unsafe: true, autofill: false },
      { text: "Open the ATO app or ATO Online services independently", id: "ato_app", unsafe: false, autofill: false },
      { text: "Ignore the message and hope it goes away", id: "ignore", unsafe: true, autofill: false }
    ],
    feedback: {
      tap_link: "Risky. The ATO will never send unsolicited messages with links asking you to log in or provide personal information. This link leads to a fake website designed to steal your details.",
      call_number: "Risky. Scammers include fake phone numbers that connect to other scammers. The ATO will never project a number when calling. Use the official number from ato.gov.au: 1800 008 540.",
      google: "Risky. Scammers pay for ads at the top of search results. These can lead to fake ATO websites. Always type ato.gov.au or my.gov.au directly into your browser.",
      ignore: "Not ideal. Ignoring a genuine ATO message could mean missing important information. The habit should be to verify, not ignore.",
      ato_app: "Correct. The safest way is to independently access the ATO app or ATO Online services through myGov. Never use links or numbers from an unexpected message."
    },
    reveal: {
      title: "What you would see in the ATO app",
      steps: [
        "Open the ATO app and log in",
        "Select 'Your tax return for 2025-26'",
        "The status shows whether a refund has been issued, is processing, or if tax is owed"
      ],
      truth: "Sam's return was still processing. No refund had been issued.",
      realismNote: "Online returns generally process within two weeks, up to 30 days if manual review is needed.",
      everyday: "This is the same screen Sam would open to track a genuine refund.",
      source: "ato.gov.au/individuals-and-families/your-tax-return/check-the-progress-of-your-tax-return",
      screenshot: "ato-dashboard.jpg"
    }
  },
  {
    id: 2,
    title: "Fake Account Security Alert",
    character: { name: "Maya", age: 20, initial: "M", emoji: "👩‍🎓" },
    setup: "Maya is a university student who works part-time and has a myGov account linked to the ATO.",
    message: {
      channel: "Email",
      sender: "security@ato-gov-alert.com",
      timestamp: "Today, 9:47am",
      body: "Subject: URGENT: Suspicious activity detected on your ATO account\n\nDear Taxpayer,\n\nWe have detected unusual login activity on your ATO account. For your security, your account has been temporarily restricted.\n\nYou must verify your identity within 24 hours to prevent permanent suspension.\n\n[Verify Account Now]\n\nAustralian Taxation Office"
    },
    question: "What should Maya do?",
    options: [
      { text: "Click the 'Verify Account Now' button in the email", id: "click_link", unsafe: true, autofill: true },
      { text: "Reply to the email asking for more information", id: "reply_email", unsafe: true, autofill: false },
      { text: "Independently log in to ATO Online services through myGov to check", id: "ato_app", unsafe: false, autofill: false },
      { text: "Forward the email to a friend to ask if it looks real", id: "ask_friend", unsafe: true, autofill: false }
    ],
    feedback: {
      click_link: "This email is designed to look official but the sender address is wrong. The ATO will never send unsolicited emails containing hyperlinks or QR codes. Clicking could lead to a fake login page that steals your myGov credentials.",
      reply_email: "Replying confirms to scammers that your email address is active. It also risks sharing personal information. The ATO will never ask for personal identifying information via email.",
      ask_friend: "While getting a second opinion can help, it doesn't verify the message. The only way to be sure is to check your account through official channels.",
      ato_app: "Correct. Maya should not interact with the email at all. She should independently access ATO Online services by typing my.gov.au into her browser, logging in, and checking her ATO account for any genuine alerts."
    },
    reveal: {
      title: "How Maya checks her real account",
      steps: [
        "Open a browser and type my.gov.au directly (never click email links)",
        "Log in to myGov and select ATO from linked services",
        "Check the home page and myGov Inbox for genuine ATO communications"
      ],
      truth: "Maya's ATO account showed no restrictions. The email was a phishing attempt.",
      realismNote: "The ATO will never send unsolicited messages with links asking you to log in. Real ATO communications arrive in your myGov Inbox or through official letters.",
      everyday: "Checking ATO Online services through myGov is how Australians view their tax file number, communication history, payment plans, and account details — the same pathway protects against phishing scams.",
      source: "ato.gov.au/online-services/scams-cyber-safety-and-identity-protection/verify-or-report-an-ato-scam"
    }
  },
  {
    id: 3,
    title: "Fake ATO Debt Demand",
    character: { name: "Jordan", age: 27, initial: "J", emoji: "🧑‍💼" },
    setup: "Jordan has been working full-time for three years and recently changed jobs.",
    message: {
      channel: "Voicemail",

let currentScreen = 'landing';
let currentScenario = 0;
let userChoices = [];
let lastChoice = null;
let msgTimer = null;

function reducedMotion() {
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

/* Sound cues are synthesised with the Web Audio API, so there are no
   audio files to download. Set Sound.on = false below to mute by default. */
const Sound = {
  on: true,
  ctx: null,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, type = 'sine', vol = 0.12, delay = 0) {
    if (!this.on) return;
    this.init();
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  },
  tap() { this.tone(420, 0.07, 'triangle', 0.06); },
  ding() { this.tone(880, 0.16, 'sine', 0.11); this.tone(1320, 0.18, 'sine', 0.05, 0.05); },
  correct() { [523.25, 659.25, 783.99].forEach((f, i) => this.tone(f, 0.22, 'sine', 0.12, i * 0.09)); },
  wrong() { this.tone(200, 0.28, 'sawtooth', 0.08); this.tone(150, 0.34, 'sawtooth', 0.06, 0.06); },
  finish() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, 0.34, 'triangle', 0.12, i * 0.12)); }
};

function toggleSound() {
  Sound.on = !Sound.on;
  const btn = document.getElementById('sound-toggle');
  btn.textContent = Sound.on ? '🔊' : '🔇';
  btn.setAttribute('aria-label', Sound.on ? 'Mute sound' : 'Unmute sound');
  if (Sound.on) Sound.tap();
}

function confetti(count = 30) {
  if (reducedMotion()) return;
  const layer = document.getElementById('confetti');
  const colors = ['#f59e0b', '#22c55e', '#3b82f6', '#fbbf24', '#a78bfa', '#f472b6'];
  for (let i = 0; i < count; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[i % colors.length];
    piece.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
    piece.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    piece.style.animationDuration = (1.6 + Math.random() * 1.2) + 's';
    piece.style.animationDelay = (Math.random() * 0.25) + 's';
    layer.appendChild(piece);
    setTimeout(() => piece.remove(), 3400);
  }
}

/* Subtle tap on navigation buttons. Option buttons are excluded because
   they trigger their own verdict sound a moment later. */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.btn');
  if (btn && !btn.classList.contains('btn-option')) Sound.tap();
});

function safeSoFar() {
  return userChoices.filter(c => c.safe).length;
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (currentScreen === 'landing') renderLanding(app);
  else if (currentScreen === 'scenario-setup') renderScenarioSetup(app);
  else if (currentScreen === 'scenario-message') renderScenarioMessage(app);
  else if (currentScreen === 'scenario-decision') renderScenarioDecision(app);
  else if (currentScreen === 'scenario-feedback') renderScenarioFeedback(app);
  else if (currentScreen === 'scenario-reveal') renderScenarioReveal(app);
  else if (currentScreen === 'report') renderReport(app);
}

function renderProgress(opts = {}) {
  let dots = '';
  for (let i = 0; i < scenarios.length; i++) {
    let cls = '';
    if (i < currentScenario) cls = 'complete';
    else if (i === currentScenario) cls = 'active';
    dots += `<div class="progress-dot ${cls}"></div>`;
  }
  return `
    <div class="hud">
      <span class="hud-label">Situation ${currentScenario + 1} of ${scenarios.length}</span>
      <span class="score-chip ${opts.bump ? 'bump' : ''}">✅ ${safeSoFar()} verified</span>
    </div>
    <div class="progress-bar">${dots}</div>
  `;
}

function renderLanding(container) {
  container.innerHTML = `

          <h3>${s.character.name}, ${s.character.age}</h3>
          <span>${s.setup}</span>
        </div>

function renderScenarioMessage(container) {
  const s = scenarios[currentScenario];
  const messageHtml = `
    <div class="message-bubble msg-in">
      <div class="sender">${s.message.sender} · ${s.message.timestamp}</div>
      <div style="white-space:pre-line; color:var(--text);">${s.message.body}</div>
    </div>
    <button class="btn btn-primary" onclick="goTo('scenario-decision')">How would you check?</button>
  `;

  container.innerHTML = `
    <div class="card">
      ${renderProgress()}
      <span class="tag tag-simulated">Simulated ${s.message.channel}</span>
      <div id="msg-slot">
        <div class="typing-bubble" aria-label="Message incoming"><span></span><span></span><span></span></div>
      </div>
    </div>
  `;

  const slot = container.querySelector('#msg-slot');
  clearTimeout(msgTimer);

  // Brief pause so the message "arrives" rather than just appearing.
  const reveal = () => {
    if (currentScreen !== 'scenario-message') return;
    Sound.ding();
    slot.innerHTML = messageHtml;
  };

  if (reducedMotion()) reveal();
  else msgTimer = setTimeout(reveal, 1150);
}

function renderScenarioDecision(container) {
  const s = scenarios[currentScenario];
  let optionsHtml = '';
  s.options.forEach((opt, i) => {
    optionsHtml += `<button class="btn btn-option" style="animation-delay:${(i * 0.06).toFixed(2)}s" onclick="chooseOption('${opt.id}', ${opt.unsafe}, ${opt.autofill})">${opt.text}</button>`;
  });
  container.innerHTML = `
    <div class="card">
      ${renderProgress()}
      <h2>${s.question}</h2>
      ${optionsHtml}
    </div>
  `;
}

function renderScenarioFeedback(container) {
  const s = scenarios[currentScenario];
  const choice = s.options.find(o => o.id === lastChoice);
  const isUnsafe = choice.unsafe;
  const feedbackText = s.feedback[lastChoice];

  container.innerHTML = `
    <div class="card ${isUnsafe ? 'card-shake' : ''}">
      ${renderProgress({ bump: !isUnsafe })}
      <div class="verdict">
        <div class="verdict-icon ${isUnsafe ? 'risky' : 'safe'}">${isUnsafe ? '⚠️' : '✅'}</div>
        <span class="tag ${isUnsafe ? 'tag-scam' : 'tag-real'}" style="margin-bottom:0;">${isUnsafe ? 'Risky choice' : 'Good choice'}</span>
      </div>
      <p style="color:var(--text);">${feedbackText}</p>
      <button class="btn btn-primary" onclick="goTo('scenario-reveal')">See the official ATO pathway</button>
      ${isUnsafe ? `<button class="btn btn-back" onclick="goTo('scenario-decision')">Choose differently</button>` : ''}
    </div>
  `;

  if (isUnsafe) {
    Sound.wrong();
  } else {
    Sound.correct();
    confetti(16);
  }
}

    <div class="card">
      ${renderProgress()}

        <p>${s.reveal.everyday}</p>

      <p style="font-size:0.75rem; color:var(--text-muted); margin-top:12px;">

      <button class="btn btn-primary" onclick="nextScenario()" style="margin-top:16px;">

function renderReport(container) {
  const safeCount = userChoices.filter(c => c.safe).length;
  const total = scenarios.length;

  let summaryHtml = '';
  scenarios.forEach((s, i) => {
    const choice = userChoices.find(c => c.scenarioId === s.id);
    const chosenOpt = s.options.find(o => o.id === choice?.choiceId);
    const icon = choice?.safe ? '✅' : '⚠️';
    summaryHtml += `
      <div class="summary-item" style="animation-delay:${(i * 0.07).toFixed(2)}s">
        <div class="title">${icon} ${s.title}</div>
        <div class="choice">You chose: ${chosenOpt?.text || 'No choice'}</div>
      </div>
    `;
  });

  const rank = safeCount === total
    ? { icon: '🏆', label: 'Verification Pro' }
    : safeCount >= 4
      ? { icon: '🛡️', label: 'Scam Aware' }
      : { icon: '📘', label: 'Keep Practising' };

  container.innerHTML = `
    <div class="card">
      <h1 style="text-align:center;">Your Report</h1>
      <div class="rank-badge">${rank.icon}</div>
      <div class="rank-label">${rank.label}</div>
      <div class="report-metric">
        <div class="number" id="score-number">0/${total}</div>
        <div class="label">situations where you used an official ATO verification method</div>
      </div>
      <p style="text-align:center; color:var(--text);">
        ${safeCount === total 
          ? "Excellent. You consistently chose to verify through official ATO channels." 
          : safeCount >= 4 
            ? "Good work. You used official verification in most situations. Review the ones you missed."
            : "Keep practising. The safest habit is to always verify through an official ATO channel."}
      </p>
      <div style="margin:20px 0;">
        ${summaryHtml}
      </div>
      <div class="reveal-box" style="border-left-color:var(--accent); background:rgba(245,158,11,0.08);">
        <h4 style="color:var(--accent);">Remember</h4>
        <p>When something involving your tax, super, or ATO account seems suspicious, don't trust the message and don't blindly ignore it. <strong>Verify it through an official ATO channel.</strong></p>
      </div>
      <button class="btn btn-primary" onclick="restart()" style="margin-top:16px;">Start Again</button>
    </div>
  `;

  // Count the score up rather than just printing it.
  const scoreEl = container.querySelector('#score-number');
  if (reducedMotion()) {
    scoreEl.textContent = `${safeCount}/${total}`;
  } else {
    let n = 0;
    const tick = () => {
      n++;
      scoreEl.textContent = `${n}/${total}`;
      Sound.tone(440 + n * 90, 0.09, 'sine', 0.07);
      if (n < safeCount) setTimeout(tick, 240);
    };
    if (safeCount > 0) setTimeout(tick, 350);
  }

  Sound.finish();
  if (safeCount >= 4) setTimeout(() => confetti(50), 500);
}

function startScenarios() {
  currentScenario = 0;
  userChoices = [];
  goTo('scenario-setup');
}

function goTo(screen) {
  currentScreen = screen;
  render();
}

function chooseOption(choiceId, isUnsafe, hasAutofill) {
  lastChoice = choiceId;
  const s = scenarios[currentScenario];
  const opt = s.options.find(o => o.id === choiceId);

  // Replace any previous answer for this scenario so that "Choose differently"
  // does not leave a stale entry behind (which made the score and the summary
  // disagree with each other).
  const entry = { scenarioId: s.id, choiceId, safe: !opt.unsafe };
  const existing = userChoices.findIndex(c => c.scenarioId === s.id);
  if (existing >= 0) userChoices[existing] = entry;
  else userChoices.push(entry);

  if (opt.unsafe && hasAutofill) {
    showAutofill(() => { goTo('scenario-feedback'); });
  } else {
    goTo('scenario-feedback');
  }
}

function showAutofill(onComplete) {
  const overlay = document.getElementById('autofill-overlay');
  overlay.classList.remove('hidden');
  const box = overlay.querySelector('.autofill-box');
  box.innerHTML = box.innerHTML;
  setTimeout(() => {
    overlay.classList.add('hidden');
    onComplete();
  }, 4200);
}

function nextScenario() {
  currentScenario++;
  if (currentScenario >= scenarios.length) {
    goTo('report');
  } else {
    goTo('scenario-setup');
  }
}

function restart() {
  clearTimeout(msgTimer);
  currentScreen = 'landing';
  currentScenario = 0;
  userChoices = [];
  lastChoice = null;
  render();
}

render();
</script>

</body>
</html>
